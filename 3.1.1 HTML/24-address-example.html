<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>24｜address：聯絡資訊</title>
</head>
<body>
    <!-- 測試 mailto 連結需設定電子郵件應用程式。 -->
    <footer>
        <address>
            聯絡信箱：
            <a href="mailto:service@example.com">
                service@example.com
            </a>
        </address>
    </footer>

    <!-- 觀察：聯絡資訊與活動地點不同 -->
</body>
</html>
