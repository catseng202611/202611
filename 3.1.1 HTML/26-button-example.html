<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>26｜button：按鈕與連結</title>
</head>
<body>
    <!-- 測試連結會開啟同一資料夾的 about.html。送出按鈕在本例未連接表單。 -->
    <a href="about.html">查看介紹</a>
    <button type="button">一般按鈕</button>
    <button type="submit">送出</button>
    <button type="button" disabled>停用</button>

    <!-- 觀察：一般 button 不會自行執行自訂動作 -->
</body>
</html>
