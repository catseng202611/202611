<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>13｜caption 表格標題</title>
</head>
<body>
    <table border="1" style="width:100%">
        <caption>課程報名統計</caption>
        <tr><th>課程</th><th>人數</th></tr>
        <tr><td>HTML</td><td>20</td></tr>
    </table>

    <!-- 觀察：caption 說明整張表格 -->
</body>
</html>
