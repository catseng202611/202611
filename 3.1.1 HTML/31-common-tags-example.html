<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>31｜剩餘常用標籤總覽</title>
</head>
<body>
    <blockquote><p>持續練習。</p></blockquote>
    <pre><code>&lt;h1&gt;Hello&lt;/h1&gt;</code></pre>
    <dl>
        <dt>HTML</dt><dd>網頁結構</dd>
        <dt>CSS</dt><dd>網頁外觀</dd>
    </dl>

    <!-- 觀察：今天重點是辨識用途，不必背完所有標籤 -->
</body>
</html>
