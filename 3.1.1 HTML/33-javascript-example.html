<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>33｜HTML 如何連接 JavaScript</title>
</head>
<body>
    <!-- 教材附的 app.js 用於觀察外部載入。點擊行為仍由本頁的 onclick 示範。 -->
    <!-- HTML 直接指定點擊行為 -->
    <button type="button" onclick="alert('Hello HTML')">點我</button>
    <!-- 載入外部 JavaScript -->
    <script src="app.js" defer></script>

    <!-- 觀察：onclick 只做展示，未來 JS 再學事件監聽 -->
</body>
</html>
