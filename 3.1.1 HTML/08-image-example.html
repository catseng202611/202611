<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>08｜圖片 img 與 alt</title>
</head>
<body>
    <!-- 教材附有三個本機圖片檔。根目錄路徑請從教材資料夾啟動 Live Server。example.com 的圖片網址是投影片中的示意網址。 -->
    <!-- 相對路徑：同一資料夾 -->
    <img src="cat.jpg" alt="小貓">
    <!-- 相對路徑：子資料夾 -->
    <img src="images/cat.png" alt="小貓">
    <!-- 根目錄路徑：從網站根目錄開始 -->
    <img src="/images/cat.webp" alt="小貓">
    <!-- 外部網址：絕對 URL -->
    <img src="https://example.com/cat.jpg" alt="小貓">

    <!-- 觀察：src 決定圖片來源，alt 提供圖片無法顯示時的替代文字。 -->
</body>
</html>
