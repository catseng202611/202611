<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>12｜thead、tbody、tfoot</title>
</head>
<body>
    <table>
        <thead><tr><th>項目</th><th>數量</th></tr></thead>
        <tbody><tr><td>書籍</td><td>3</td></tr></tbody>
        <tfoot><tr><td>合計</td><td>3</td></tr></tfoot>
    </table>

    <!-- 觀察：把表格分成不同區域 -->
</body>
</html>
