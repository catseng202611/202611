<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>07｜超連結 a</title>
</head>
<body>
    <!--
        相對路徑：about/index.html
        網站根目錄路徑：/about/index.html
        絕對 URL：href="https://example.com/about/index.html"
        _self 在目前分頁開啟（預設），_blank 開啟新分頁或視窗。
        -->
    <!-- 基本語法：<a href="連結網址">連結文字</a> -->
    <a href="https://www.google.com">
        前往 Google 首頁
    </a>
    <!-- about.html 是同一資料夾中的教材示意頁。 -->
    <a href="about.html">
        關於我們
    </a>
    <a href="mailto:example@gmail.com">
        寄信給我們
    </a>
    <a href="https://example.com">連結</a>
    <a href="https://example.com" target="_blank">
        在新分頁中開啟
    </a>
    <!-- logo.png 是同一資料夾中的示意圖。 -->
    <a href="https://example.com">
        <img src="logo.png" alt="網站 Logo">
    </a>
</body>
</html>
