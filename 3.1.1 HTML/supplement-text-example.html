<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>文字類型標籤範例</title>
</head>
<body>
    <h2>文字類型標籤範例</h2>
    <p>這是 <b>粗體</b>、<i>斜體</i>、<u>底線</u> 的文字。</p>
    <p>這是 <strong>重要的文字</strong>，需要特別注意。</p>
    <p>這是 <em>強調的文字</em>，表示語氣上的強調。</p>
    <p>這是 <mark>標記的文字</mark>，用來突顯重點。</p>
    <p>這是 <small>小號文字</small>，比一般文字小。</p>
    <p>這是被 <del>刪除的文字</del>，表示不再有效。</p>
</body>
</html>
