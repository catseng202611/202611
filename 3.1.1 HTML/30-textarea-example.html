<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>30｜textarea：多行輸入</title>
</head>
<body>
    <label for="message">留言內容：</label>
    <textarea id="message" name="message" rows="5" maxlength="200" placeholder="請輸入心得"></textarea>

    <!-- 觀察：textarea 不是 input type="textarea" -->
</body>
</html>
