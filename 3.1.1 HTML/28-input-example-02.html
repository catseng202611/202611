<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>28｜input 的常見 type</title>
</head>
<body>
    <!-- 文字輸入（單行） -->
    <input type="text">
    <!-- 密碼輸入 -->
    <input type="password">
    <!-- 電子郵件 -->
    <input type="email">
    <!-- 數字 -->
    <input type="number">
    <!-- 電話 -->
    <input type="tel">
    <!-- 網址 -->
    <input type="url">
    <!-- 日期 -->
    <input type="date">
    <!-- 時間 -->
    <input type="time">
    <!-- 日期時間 -->
    <input type="datetime-local">
    <!-- 單選按鈕 -->
    <input type="radio">
    <!-- 核取方塊 -->
    <input type="checkbox">
    <!-- 檔案上傳 -->
    <input type="file">
    <!-- 隱藏欄位 -->
    <input type="hidden">
    <!-- 重設按鈕 -->
    <input type="reset">
    <!-- 一般按鈕 -->
    <input type="button">
    <!-- 提交按鈕 -->
    <input type="submit">
    <!-- 顏色選擇器 -->
    <input type="color">
    <!-- 範圍選擇器 -->
    <input type="range">
</body>
</html>
