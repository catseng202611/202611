<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>25｜details 與 summary</title>
</head>
<body>
    <details>
        <summary>HTML 是什麼？</summary>
        <p>HTML 是標記語言。</p>
    </details>
    <details open>
        <summary>課程提醒</summary>
        <p>請記得練習。</p>
    </details>

    <!-- 觀察：open 是布林屬性 -->
</body>
</html>
