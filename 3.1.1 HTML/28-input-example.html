<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>28｜input 的常見 type</title>
</head>
<body>
    <input type="text" name="name">
    <input type="email" name="email" required>
    <input type="number" name="count" min="1" max="10">
    <input type="password" name="pass">

    <!-- 觀察：password 不是加密功能 -->
</body>
</html>
