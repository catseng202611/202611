<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>09｜ul、ol、li 清單</title>
</head>
<body>
    <ul>
        <li>首頁</li>
        <li>關於我們</li>
        <li>產品介紹</li>
        <li>聯絡我們</li>
    </ul>
    <ol>
        <li>打開瀏覽器</li>
        <li>輸入網址</li>
        <li>按下 Enter 鍵</li>
        <li>瀏覽網站內容</li>
    </ol>
    <dl>
        <dt>HTML</dt>
        <dd>用來建立網頁結構的標記語言。</dd>
        <dt>CSS</dt>
        <dd>用來設定網頁樣式的語言。</dd>
    </dl>
</body>
</html>
