<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>22｜figure 與 figcaption</title>
</head>
<body>
    <!-- cat.jpg 是同一資料夾中的教材示意圖。 -->
    <figure>
        <img src="cat.jpg" alt="草地上的小貓">
        <figcaption>圖一：校園中的小貓</figcaption>
    </figure>

    <!-- 觀察：圖片描述與圖說有不同任務 -->
</body>
</html>
