<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>14｜colspan 與 rowspan</title>
</head>
<body>
    <!-- 表尾數值依同頁表格預覽核對。 -->
    <table>
        <caption>112學年度各班成績統計表</caption>
        <thead>
            <tr>
                <th>班級</th>
                <th>國文</th>
                <th>數學</th>
                <th>英文</th>
                <th>總分平均</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>一年一班</td><td>85</td><td>90</td><td>88</td><td>87.7</td></tr>
            <tr><td>一年二班</td><td>82</td><td>78</td><td>85</td><td>81.7</td></tr>
            <tr><td>一年三班</td><td>90</td><td>92</td><td>95</td><td>92.3</td></tr>
        </tbody>
        <tfoot>
            <tr><td>全年級平均</td><td>85.7</td><td>86.7</td><td>89.3</td><td>87.2</td></tr>
        </tfoot>
    </table>

    <!-- 跨欄與跨列片段的表頭取自同頁預覽。 -->
    <table>
        <tr><th>項目</th><th>一月</th><th>二月</th><th>三月</th></tr>
        <tr>
            <th>項目</th>
            <th colspan="3">合併儲存格</th>
        </tr>
    </table>

    <table>
        <tr><th>類別</th><th>說明</th></tr>
        <tr>
            <td rowspan="2">電腦</td>
            <td>桌上型電腦</td>
        </tr>
        <tr>
            <td>筆記型電腦</td>
        </tr>
    </table>
</body>
</html>
