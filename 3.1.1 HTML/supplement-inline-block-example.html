<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>補充：Inline 與 Block 元素</title>
</head>
<body>
    <!-- Inline -->
    <p>這是一些文字，
        <span style="color: blue;">這是 span</span>
        和 <a href="#">這是連結</a>，
        還有 <strong>粗體文字</strong>。</p>

    <!-- Block -->
    <div style="background:#e6f0ff;">第一個 div</div>
    <p style="background:#dff5e1;">一個段落</p>
    <div style="background:#fff2cc;">第二個 div</div>
</body>
</html>
