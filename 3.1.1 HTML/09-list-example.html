<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>09｜ul、ol、li 清單</title>
</head>
<body>
    <!-- 無序清單：順序不重要 -->
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <!-- 有序清單：依照步驟執行 -->
    <ol>
        <li>建立 HTML 檔案</li>
        <li>編輯網頁內容</li>
        <li>使用瀏覽器開啟</li>
    </ol>

    <!-- 觀察：是否需要順序決定 ul 或 ol -->
</body>
</html>
